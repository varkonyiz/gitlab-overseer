# GitLab CI/CD: checks on every pipeline, deployment to GitLab Pages from the default branch.
#
# Deployment settings are CI/CD variables (Settings → CI/CD → Variables), written into
# config/app-config.json by scripts/configure-deployment.mjs (see README, "Deploy to GitLab Pages"):
#   GITLAB_URL (default: this instance, $CI_SERVER_URL), OAUTH_CLIENT_ID, OAUTH_SCOPES,
#   OAUTH_REDIRECT_URI, ALLOW_PERSONAL_ACCESS_TOKEN, DEFAULT_LANGUAGE, DEFAULT_SOURCES.
# None of them is secret: the OAuth application is non-confidential (PKCE, no client secret).

stages:
  - check
  - deploy

default:
  image: node:24-alpine
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund

check:
  stage: check
  script:
    - npm run format:check
    - npm run lint
    - npm run test:coverage
    - npm run build
  coverage: '/Lines\s*:\s*(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/gitlab-overseer/cobertura-coverage.xml

pages:
  stage: deploy
  needs: [check]
  script:
    # Project sites live under a path (https://<namespace>.gitlab.io/<project>/): use it as base href.
    - BASE_HREF="$(node -e "const p=new URL(process.env.CI_PAGES_URL).pathname; console.log(p.endsWith('/')?p:p+'/')")"
    - npx ng build --base-href "$BASE_HREF"
    - node scripts/configure-deployment.mjs dist/gitlab-overseer
    # GitLab Pages publishes the "public" artifact; the source "public/" folder is no longer needed here.
    - rm -rf public && mv dist/gitlab-overseer public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
