<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GitLab Overseer</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      GitLab Pages cannot set response headers, so the policy is a meta tag. The Pages job narrows
      connect-src from "https:" to the configured GitLab origin (see .gitlab-ci.yml).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
